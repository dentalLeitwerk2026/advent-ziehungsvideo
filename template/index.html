<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
 --bg:oklch(97.68% .0126 86.83); --fg:oklch(32.12% .0572 51.46); --heading:oklch(43.68% .0883 55.53);
 --cognac:oklch(53.76% .1082 57.70); --olive:oklch(56.57% .0433 133.50); --gold:oklch(73.08% .1154 85.19);
 --muted:oklch(94.15% .0172 84.59); --mutedfg:oklch(50.91% .0337 63.60); --border:oklch(86.75% .0243 79.73);
}
*{margin:0;padding:0;box-sizing:border-box;font-variant-numeric:lining-nums}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#s{position:relative;width:1080px;height:1920px;background:linear-gradient(160deg,var(--bg),var(--bg) 55%,var(--muted));font-family:Inter,sans-serif;color:var(--fg)}
.abs{position:absolute}
#girl{left:-60px;top:-6px;width:1200px}
#logo{left:50%;top:150px;height:118px;transform:translateX(-50%)}
#eyebrow{top:300px;width:100%;text-align:center;font-size:26px;font-weight:600;letter-spacing:.24em;color:var(--cognac)}
#eyebrow span{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--olive);margin:0 22px 4px}
#title{top:340px;width:100%;text-align:center;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:112px;line-height:1.0;color:var(--heading)}
#title em{font-style:italic}
#sub{top:562px;width:100%;text-align:center;font-family:Caveat,cursive;font-size:60px;font-weight:500;color:var(--olive)}
#nut{left:540px;top:930px;width:420px;height:420px;margin:-210px 0 0 -210px}
#circles{top:782px;left:0;width:100%;display:flex;justify-content:center;align-items:center;gap:20px}
#pre{top:668px;width:100%;text-align:center;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:100px;line-height:1;color:var(--heading);letter-spacing:.04em}
.c{width:158px;height:158px;border-radius:50%;border:3px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
.c b{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:116px;line-height:1;color:var(--heading);display:block;margin-top:-10px}
#cap{top:958px;width:100%;text-align:center;font-size:27px;color:var(--mutedfg);line-height:1.5}
#card{left:90px;top:1012px;width:900px;border:2px solid var(--border);border-radius:14px;background:var(--bg);padding:34px 52px 26px;box-shadow:0 18px 40px -24px oklch(32% .057 51 / .45)}
#card .top{display:flex;justify-content:space-between;align-items:center}
#card .lab{font-size:24px;font-weight:600;letter-spacing:.22em;color:var(--mutedfg)}
#card h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:80px;line-height:1.05;color:var(--heading);margin-top:18px}
#card p{font-size:31px;line-height:1.42;color:var(--mutedfg);margin-top:14px}
#card hr{border:0;border-top:2px solid var(--gold);margin:22px 0 14px;opacity:.7}
#card .gw{font-family:Caveat,cursive;font-size:56px;color:var(--olive);font-weight:600}
#wave{left:0;top:1510px;width:1080px;height:520px}
#cta{top:1598px;width:100%;text-align:center;color:var(--bg)}
#cta h3{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:72px;line-height:1.05}
#cta h3 em{font-style:italic;color:var(--gold)}
#cta p{font-size:30px;line-height:1.45;margin-top:18px;opacity:.9;letter-spacing:.02em}
.sp{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px}
</style></head><body>
<div id="s">
 <img id="girl" class="abs" src="a/girlande.png">
 <img id="logo" class="abs" src="a/logo.png">
 <div id="eyebrow" class="abs"><span></span><i id="eb" style="font-style:normal"></i><span></span></div>
 <div id="title" class="abs">Die <em>Glücksnuss</em><br>des Tages</div>
 <div id="sub" class="abs">Welche Nuss wird heute gezogen?</div>
 <div id="pre" class="abs">NUSS-</div>
 <div id="circles" class="abs"></div>
 <div id="cap" class="abs"></div>
 <img id="nut" class="abs" src="a/nuss.png">
 <div id="card" class="abs">
  <div class="top">
   <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--cognac)"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>
   <div class="lab" id="platz"></div>
  </div>
  <h2 id="ptitle"></h2>
  <p id="ptext"></p>
  <hr>
  <div class="gw">Glückwunsch!</div>
 </div>
 <svg id="wave" class="abs" viewBox="0 0 1080 520" preserveAspectRatio="none"><path d="M0 70 C 260 0, 520 120, 760 60 S 1000 20, 1080 50 L1080 520 L0 520 Z" fill="oklch(32.12% .0572 51.46)"/></svg>
 <div id="cta" class="abs"><h3>Ist das <em>deine</em> Glücksnuss?</h3><p id="ctap"></p></div>
 <div id="spark"></div>
</div>
<script>
// Eingabe: window.P = {day, ticket, stufe, antworten}
const PREISE={
 P1:{label:'HEILIGABEND · PLATZ 1',title:'Platz 1 · Heiligabend',text:'1× Webinar-Ticket nach Wahl kostenlos + Hazels Jahresstart-Paket für die Praxis + 60 Min. Umsetzungs-Sprechstunde mit Denise Hoffmann.'},
 P2:{label:'PLATZ 2 · DEIN GEWINN',title:'Webinar & Hazels Jahresstart-Paket',text:'1× Webinar-Ticket nach Wahl kostenlos (für eine Person) + Hazels Jahresstart-Paket für die Praxis.'},
 P3:{label:'PLATZ 3 · DEIN GEWINN',title:'50 % oder gratis + Hazels Jahresstart-Paket',text:'50 % auf 1× Webinar-Ticket ODER 1× Webinar-Aufzeichnung gratis (nach Wahl) + Hazels Jahresstart-Paket für die Praxis.'},
 P4:{label:'PLATZ 4 · DEIN GEWINN',title:'50 % oder gratis',text:'50 % auf 1× Webinar-Ticket ODER 1× Webinar-Aufzeichnung gratis (nach Wahl).'},
 P5:{label:'PLATZ 5 · DEIN GEWINN',title:'30 % für dich',text:'30 % auf 1× Webinar-Ticket oder 1× Webinar-Aufzeichnung (nach Wahl).'},
 P6:{label:'PLATZ 6 · DEIN GEWINN',title:'20 % für dich',text:'20 % auf 1× Webinar-Ticket oder 1× Webinar-Aufzeichnung (nach Wahl).'},
};
const P=window.P||{day:3,ticket:'NUSS-05661',stufe:'P5',antworten:127};
const pr=PREISE[P.stufe]; if(!pr) throw new Error('Unbekannte Preisstufe '+P.stufe);
const LOS=String(P.ticket).replace(/\D/g,'').split('').map(Number);
if(LOS.length<1||LOS.length>6) throw new Error('Losnummer ungueltig '+P.ticket);
const $=id=>document.getElementById(id);
$('eb').textContent=`TÜRCHEN ${P.day} · ZIEHUNG 20 UHR`;
$('platz').textContent=pr.label; $('ptitle').textContent=pr.title; $('ptext').textContent=pr.text;
const n=Number(P.antworten)||0;
$('cap').innerHTML=(n>=20?`${n.toLocaleString('de-DE')} haben heute mitgeraten · `:'')+'gezogen per Zufallsgenerator';
$('ctap').innerHTML='Schau in dein Postfach: Hol deinen Gewinn<br>'+(P.day>=21?'bis zum 3. Januar':'innerhalb von 72 Stunden')+' über den Link<br>in unserer Mail ab.';
LOS.forEach((_,i)=>{const d=document.createElement('div');d.className='c';d.id='c'+i;d.innerHTML='<b>0</b>';$('circles').appendChild(d)});
// Karte einpassen: muss oberhalb der Welle enden
function fit(){let h=80,p=31;const card=$('card');for(let k=0;k<30;k++){$('ptitle').style.fontSize=h+'px';$('ptext').style.fontSize=p+'px';if(card.offsetTop+card.offsetHeight<=1492)break;if(h>62)h*=.95;else p*=.96}}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const back=x=>{x=clamp(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const SP=[];let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
for(let i=0;i<22;i++){const a=rnd()*Math.PI*2,d=180+rnd()*360;SP.push({a,d,s:.5+rnd()*.9,r:rnd()*90});
 const e=document.createElementNS('http://www.w3.org/2000/svg','svg');e.setAttribute('viewBox','0 0 40 40');e.setAttribute('class','sp');e.id='sp'+i;
 e.innerHTML='<path d="M20 0 C21 14 26 19 40 20 C26 21 21 26 20 40 C19 26 14 21 0 20 C14 19 19 14 20 0Z" fill="'+(i%4==0?'oklch(56.57% .0433 133.50)':'oklch(73.08% .1154 85.19)')+'"/>';$('spark').appendChild(e);}
function set(el,o,tf){el.style.opacity=o;el.style.transform=tf||''}
const N=LOS.length, L0=3.1, LSTEP=2.3/Math.max(1,N-1);
window.render=function(t){
 set($('girl'),ease(seg(t,0,.6)),`translateY(${(1-ease(seg(t,0,.6)))*-120}px)`);
 set($('logo'),ease(seg(t,.1,.7)),'translateX(-50%)');
 const it=ease(seg(t,.2,.9)); set($('eyebrow'),it,`translateY(${(1-it)*20}px)`);
 const tt=ease(seg(t,.3,1.0)); set($('title'),tt,`translateY(${(1-tt)*30}px)`);
 const st=ease(seg(t,.6,1.2)); set($('sub'),st,`translateY(${(1-st)*20}px)`);
 const nIn=back(seg(t,.6,1.2)), nOut=ease(seg(t,2.1,2.6));
 const wob=t>1.2&&t<2.1?Math.sin((t-1.2)*28)*7*(1-seg(t,1.2,2.1)*.3):0;
 $('nut').style.opacity=clamp(seg(t,.6,.9))*(1-nOut);
 $('nut').style.transform=`translateY(${-nOut*120}px) scale(${(.2+.8*nIn)*(1-nOut*.75)}) rotate(${wob}deg)`;
 const up=-12*ease(seg(t,5.6,6.2));
 const pe=ease(seg(t,2.25,2.7)); set($('pre'),pe,`translateY(${up+(1-pe)*20}px)`);
 for(let i=0;i<N;i++){
  const c=$('c'+i), ci=back(seg(t,2.3+i*.08,2.8+i*.08));
  const lock=L0+i*LSTEP, locked=t>=lock;
  set(c,clamp(seg(t,2.3+i*.08,2.6+i*.08)),`scale(${(.6+.4*ci)*(locked?1+.12*Math.sin(Math.PI*seg(t,lock,lock+.3)):1)}) translateY(${up}px)`);
  const b=c.querySelector('b');
  if(locked){b.textContent=LOS[i];b.style.transform='';b.style.opacity=1;c.style.borderColor='oklch(73.08% .1154 85.19)';c.style.background='oklch(94.15% .0172 84.59)';c.style.borderWidth='4px'}
  else{const f=Math.floor(t*30/2);b.textContent=(f*7+i*3)%10;b.style.transform=`translateY(${(t*30%2)*-14}px)`;b.style.opacity=t>2.6?1:0;c.style.borderColor='';c.style.background='';c.style.borderWidth=''}
 }
 set($('cap'),ease(seg(t,2.8,3.3)),`translateY(${up}px)`);
 const sp=seg(t,5.5,6.8);
 SP.forEach((p,i)=>{const e=$('sp'+i);const d=ease(sp)*p.d;e.style.left=(540+Math.cos(p.a)*d)+'px';e.style.top=(800+Math.sin(p.a)*d*.7)+'px';e.style.opacity=sp>0&&sp<1?Math.sin(Math.PI*sp):0;e.style.transform=`scale(${p.s*(0.4+sp)}) rotate(${p.r+sp*120}deg)`});
 const ca=ease(seg(t,6.0,6.9)); set($('card'),ca,`translateY(${(1-ca)*90}px)`);
 const w=ease(seg(t,7.1,7.9)); set($('wave'),1,`translateY(${(1-w)*520}px)`);
 const ct=ease(seg(t,7.6,8.3)); set($('cta'),ct,`translateY(${(1-ct)*40}px)`);
};
window.ready=document.fonts.ready.then(()=>{fit();render(0);return true});
</script></body></html>
